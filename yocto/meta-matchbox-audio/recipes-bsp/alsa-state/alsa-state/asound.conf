# Matchbox Audio ALSA defaults.
#
# The PIM483 line-out uses the hifiberry-dac overlay. Onboard audio is disabled
# in the Raspberry Pi boot config, so the I2S DAC is expected to be card 0.

pcm.matchbox_i2s_hw {
    type hw
    card 0
    device 0
}

pcm.!default {
    type plug
    slave.pcm "matchbox_i2s_hw"
}

ctl.!default {
    type hw
    card 0
}
