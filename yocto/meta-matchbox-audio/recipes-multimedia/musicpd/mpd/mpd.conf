# Matchbox Audio MPD configuration.
# Phase 3: local-only MPD with PIM483 line-out playback.

music_directory      "/data/music"
playlist_directory   "/data/mpd/playlists"
db_file              "/data/mpd/mpd.db"
state_file           "/data/mpd/state"
sticker_file         "/data/mpd/sticker.sql"
log_file             "syslog"

user                 "mpd"
group                "audio"

# Bind to loopback only. The Rust mba-player daemon is the only intended client.
bind_to_address      "127.0.0.1"
port                 "6600"

# Permissions are not enforced because MPD is only reachable from localhost,
# but keep the default permissions explicit for clarity.
default_permissions  "read,add,control,admin"

# Symlink discipline matches the Phase 4 library-handling rules.
follow_outside_symlinks "no"
follow_inside_symlinks  "no"

# Avahi/Zeroconf is unnecessary: clients connect over localhost.
zeroconf_enabled     "no"

input {
    plugin "curl"
}

# The PIM483 line-out is exposed by the hifiberry-dac overlay. ALSA defaults
# point at that I2S card; MPD owns user-facing volume through its software mixer.
audio_output {
    type        "alsa"
    name        "matchbox-pim483-lineout"
    device      "default"
    mixer_type  "software"
}
