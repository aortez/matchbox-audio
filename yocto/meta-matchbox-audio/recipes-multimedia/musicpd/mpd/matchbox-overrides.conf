# Matchbox Audio overrides for mpd.service.
# Wait for /data and the Matchbox data initializer before starting MPD.

[Unit]
After=data.mount mba-data-init.service
Wants=data.mount mba-data-init.service

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/data/mpd
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
Restart=on-failure
RestartSec=2
